<div id="main">
<div class="bar">

<button id="zout">➖</button><span id="zl" style="min-width:44px;text-align:center;align-self:center">100%</span><button id="zin">➕</button><button id="zreset">⤢ Fit</button><input type="text" id="find" list="finds" placeholder="🔎 Find…" style="width:130px"><datalist id="finds"></datalist>

<div class="bar" id="tabs"></div>
<div id="wrap"><canvas id="c" width="1344" height="840"></canvas></div>
<div id="info" hidden><div class="ihead"><span id="iicon" title="Click to change icon" style="cursor:pointer"></span><input type="text" id="iname" placeholder="Name"><button id="idel" title="Delete">🗑️</button><button id="iclose" title="Close">✕</button></div>

<div id="hint"></div>
<div id="tip" hidden></div>
<div id="fmodal" hidden><div id="fbox"></div></div>
<div id="modal" hidden><div id="mbox">

<div id="mmsg" style="margin-top:8px;font-style:italic"></div>
<div class="bar" style="margin-top:10px"><button data-a="newproj">🆕 New project</button></div>
</div></div>
</div></div></template>
